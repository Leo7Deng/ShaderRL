[project]
name = "shaderrl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cairosvg>=2.9.1",
    "dreamsim>=0.2.1",
    "peft>=0.21.3",
